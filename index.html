
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感謝祭広告</title>

<style>
body {
  font-family: sans-serif;
  margin: 0;
  background-color: #f9f9f9;
  text-align: center;
}

/* 広告エリア */
.ad {
  padding: 5px 0 10px;
  font-size: 0;
}

/* 説明文 */
.ad p {
  margin: 5px 0 10px;
  font-size: 14px;
}

/* サムネイル */
.ad img {
  width: 250px;
  margin: 5px;
  cursor: pointer;
  transition: opacity 0.2s;
  vertical-align: top;
}

.ad img:hover {
  opacity: 0.8;
}

/* スマホ対応 */
@media (max-width: 600px) {
  .ad img {
    width: 42%;
    max-width: 250px;
  }
}
</style>

</head>

<body>

<div class="ad">

  <p>画像をクリックすると拡大できます</p>

  <a href="fes1.JPG" target="_blank">
    <img src="fes1sub.JPG" alt="感謝祭広告1">
  </a>

  <a href="fes2.JPG" target="_blank">
    <img src="fes2sub.JPG" alt="感謝祭広告2">
  </a>

</div>

</body>
</html>
